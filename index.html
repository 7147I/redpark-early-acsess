<!doctype html>
<html lang="bg">
<head>
  <title>Red Park Secret Access</title>
  <meta charset='UTF-8'>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'avenir next', avenir,
        'helvetica neue', helvetica, ubuntu, roboto, noto, 'segoe ui', arial,
        sans-serif;
      overflow: hidden;
    }
    .hello-message {
      margin: 0;
      padding: 0;
      text-align: center;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 90%;
      max-width: 520px;
    }
    .hello-message .logo-wrap {
      margin-bottom: 32px;
    }
    .hello-message img.logo {
      width: 128px;
      height: 128px;
      border-radius: 24px;
      box-shadow: 0 8px 32px rgba(230, 57, 70, 0.3);
    }
    .hello-message h1 {
      font-size: 32px;
      font-weight: 700;
      color: #1a1a2e;
      margin: 0 0 12px 0;
      letter-spacing: -0.5px;
    }
    .hello-message p.subtitle {
      font-size: 18px;
      color: #6c757d;
      margin: 0 0 8px 0;
      font-weight: 400;
    }
    .hello-message p.hint {
      font-size: 14px;
      color: #adb5bd;
      margin: 0 0 28px 0;
    }
    .hello-message .enter-btn {
      display: inline-block;
      background: linear-gradient(135deg, #e63946, #c1121f);
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      padding: 14px 48px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      box-shadow: 0 4px 16px rgba(230, 57, 70, 0.35);
    }
    .hello-message .enter-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(230, 57, 70, 0.45);
    }
    .hello-message .enter-btn:active {
      transform: translateY(0);
    }
    .hello-message .badge {
      display: inline-block;
      background: #f1f3f5;
      color: #868e96;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 20px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .logout-messages {
      pointer-events: none;
      color: red;
      margin: 40px;
      position: fixed;
      top: 0;
      left: 0;
      text-shadow: 2px 2px #FFF, 4px 4px 10px #000;
    }
    img {
      width: 300px;
    }
    @keyframes blurslowly {
      0% { filter: none; }
      92% { filter: blur(0); }
      96% { filter: blur(1px); }
      100% { filter: blur(0); }
    }
    body {
      animation-name: blurslowly;
      animation-iteration-count: infinite;
      animation-duration: 15s;
      animation-play-state: running;
    }
  </style>
  <link rel="icon" type="image/svg+xml" href="media/images/logo.svg">

  <meta property="og:title" content="Red Park Secret Access" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://redpark-early-acsess.github.io" />
  <meta property="og:image" content="media/images/logo.svg" />
  <meta property="og:description" content="Ранен достъп до Red Park – тайна платформа." />
  <meta name="keywords" content="red park, secret access, ранен достъп, redpark">
  <meta name="description" content="Ранен достъп до Red Park – тайна платформа.">
  <meta name="theme-color" content="#e63946">
</head>
<body>

<noscript>Моля, активирайте JavaScript, за да продължите.</noscript>
<template>
  <div class='hello-message'>
    <div class="logo-wrap">
      <img class="logo" src='media/images/logo.svg' alt='Red Park' />
    </div>
    <span class="badge">Ранен достъп</span>
    <h1>Red Park Secret Access</h1>
    <p class="subtitle">Добре дошли в тайната платформа.</p>
    <p class="hint">Натиснете бутона, за да влезете.</p>
    <button class="enter-btn" onclick="document.body.click()">Влез сега</button>
  </div>
  <div class='logout-messages'></div>
</template>

<script src='index.js'></script>

</body>
</html>
